name: Build AirGestalt Dual-Target IPAs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LiveContainer & SideStore IPAs
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Audio DSP Self-Test Suite
        run: swift scripts/run_dsp_self_tests.swift

      - name: Build AirGestaltCore (LiveContainer Compatible)
        run: |
          xcodebuild clean build \
            -project AirGestalt.xcodeproj \
            -scheme AirGestaltCore \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data_core \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=""

      - name: Build AirGestaltFull (SideStore / AltStore with Dynamic Island)
        run: |
          xcodebuild clean build \
            -project AirGestalt.xcodeproj \
            -scheme AirGestaltFull \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data_full \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=""

      - name: Package AirGestalt-LiveContainer.ipa
        run: |
          mkdir -p build_output/core/Payload
          APP_PATH=$(find derived_data_core -name "AirGestalt.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: AirGestalt.app not found!"
            exit 1
          fi
          cp -R "$APP_PATH" build_output/core/Payload/
          cd build_output/core
          zip -r ../../AirGestalt-LiveContainer.ipa Payload
          cd ../..

      - name: Package AirGestalt-SideStore.ipa
        run: |
          mkdir -p build_output/full/Payload
          FULL_APP_PATH=$(find derived_data_full -name "AirGestalt Pro.app" -type d | head -n 1)
          if [ -z "$FULL_APP_PATH" ]; then
            echo "Error: AirGestalt Pro.app not found!"
            exit 1
          fi
          cp -R "$FULL_APP_PATH" build_output/full/Payload/
          cd build_output/full
          zip -r ../../AirGestalt-SideStore.ipa Payload
          cd ../..

      - name: Upload IPAs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirGestalt-IPAs
          path: |
            AirGestalt-LiveContainer.ipa
            AirGestalt-SideStore.ipa

      - name: Create Automatic GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'AirGestalt v1.0.0' }}
          body: |
            ## AirGestalt Dual-Target Release
            
            - **AirGestalt-LiveContainer.ipa**: Clean standalone app without app extensions. 100% compatible with non-jailbroken JIT-based LiveContainer environments.
            - **AirGestalt-SideStore.ipa**: Complete app featuring Dynamic Island & Lock Screen Live Activities via ActivityKit. For direct sideloading via SideStore, AltStore, or TrollStore.
            
            Built automatically via Zero-Mac XcodeGen CI/CD.
          draft: false
          prerelease: false
          files: |
            AirGestalt-LiveContainer.ipa
            AirGestalt-SideStore.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
