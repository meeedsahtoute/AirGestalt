name: Build AirGestalt Dual-Target IPAs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build LiveContainer & SideStore IPAs
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build AirGestaltCore (LiveContainer Compatible)
        run: |
          xcodebuild clean build \
            -project AirGestalt.xcodeproj \
            -scheme AirGestaltCore \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data_core \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Build AirGestaltFull (SideStore / AltStore with Dynamic Island)
        run: |
          xcodebuild clean build \
            -project AirGestalt.xcodeproj \
            -scheme AirGestaltFull \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data_full \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package AirGestalt-LiveContainer.ipa
        run: |
          mkdir -p build_output/core/Payload
          cp -R derived_data_core/Build/Products/Release-iphoneos/AirGestalt.app build_output/core/Payload/
          cd build_output/core
          zip -r ../../AirGestalt-LiveContainer.ipa Payload
          cd ../..

      - name: Package AirGestalt-SideStore.ipa
        run: |
          mkdir -p build_output/full/Payload
          cp -R derived_data_full/Build/Products/Release-iphoneos/"AirGestalt Pro.app" build_output/full/Payload/
          cd build_output/full
          zip -r ../../AirGestalt-SideStore.ipa Payload
          cd ../..

      - name: Upload IPAs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirGestalt-IPAs
          path: |
            AirGestalt-LiveContainer.ipa
            AirGestalt-SideStore.ipa

      - name: Create Automatic GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: AirGestalt Release (${{ github.ref_name }})
          body: |
            ## AirGestalt Dual-Target Release
            
            - **AirGestalt-LiveContainer.ipa**: Clean standalone app without app extensions. 100% compatible with non-jailbroken JIT-based LiveContainer environments.
            - **AirGestalt-SideStore.ipa**: Complete app featuring Dynamic Island & Lock Screen Live Activities via ActivityKit. For direct sideloading via SideStore, AltStore, or TrollStore.
            
            Built automatically via Zero-Mac XcodeGen CI/CD.
          draft: false
          prerelease: false
          files: |
            AirGestalt-LiveContainer.ipa
            AirGestalt-SideStore.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
