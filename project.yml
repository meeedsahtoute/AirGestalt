name: AirGestalt
options:
  bundleIdPrefix: com.airgestalt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  AirGestaltCore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/App
      - Sources/Models
      - Sources/Core
      - Sources/Profiles
      - Sources/UI
      - Config/Assets.xcassets
    info:
      path: Config/Info-Core.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: AirGestalt
        PRODUCT_BUNDLE_IDENTIFIER: com.airgestalt.app.core
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual

  AirGestaltWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Extensions
      - Sources/Models
    info:
      path: Config/Info-Widget.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: AirGestaltWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.airgestalt.app.full.widget
        CODE_SIGN_STYLE: Manual

  AirGestaltFull:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/App
      - Sources/Models
      - Sources/Core
      - Sources/Profiles
      - Sources/UI
      - Config/Assets.xcassets
    dependencies:
      - target: AirGestaltWidget
    info:
      path: Config/Info-Full.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: AirGestalt Pro
        PRODUCT_BUNDLE_IDENTIFIER: com.airgestalt.app.full
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
